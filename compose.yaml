services:
  mariadb:
    image: mariadb:latest
    container_name: shop-mariadb
    environment:
      MARIADB_DATABASE: borneo
      MARIADB_USER: borneo-user
      MARIADB_PASSWORD:
      MARIADB_ROOT_PASSWORD:
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
